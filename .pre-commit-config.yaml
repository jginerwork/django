repos:
  # 1. Limpieza básica
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 2. Autoflake (Borra imports y variables no usadas PRIMERO)
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - "--in-place"
          - "--remove-all-unused-imports"
          - "--remove-unused-variables"

  # 3. Isort (Ordena los imports)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args:
          - "--profile"
          - "black"
          - "--no-sections"  # <--- ESTO ELIMINA LOS ESPACIOS ENTRE GRUPOS
          - "--line-length"
          - "88"

  # 4. Black (Formatea todo el código AL FINAL)
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black

  # 5. Flake8 (Revisa errores lógicos)
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,E501"]
