repos:
  # 1. Hooks básicos (limpieza de espacios, finales de archivo, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 2. Black (El formateador de código más famoso)
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black

  # 3. Isort (Ordena tus imports alfabéticamente y por tipo)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - "--in-place"
          - "--remove-all-unused-imports"
          - "--remove-unused-variables"

  # 4. Flake8 (Busca errores de sintaxis y estilo PEP8)
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Opcional: ignorar longitud de línea si choca con Black
        args: ["--max-line-length=88", "--extend-ignore=E203,E501"]
